<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Presión es un juego web de reflejos, nervios y lógica tramposa con niveles configurables en JSON. Pulsa, espera, cuenta y no caigas."
    />
    <meta property="og:title" content="Presión · juego de reflejos" />
    <meta
      property="og:description"
      content="Un botón, instrucciones sospechosas y niveles cada vez más tensos."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#120017" />

    <title>Presión · juego de reflejos</title>

    <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
  </head>

  <body class="min-h-screen bg-[var(--color-bg)] text-[var(--color-text)] antialiased">
    <a class="skip-link" href="#game">Saltar al juego</a>

    <main id="game" class="game-shell" aria-live="polite">
      <section class="screen screen-home" data-screen="home" aria-labelledby="home-title">
        <p class="eyebrow">modo presión</p>
        <h1 id="home-title">Presión</h1>
        <p class="screen-copy">
          Lee el botón, cuenta rápido y decide si tocarlo o dejarlo en paz.
        </p>
        <button class="primary-action" type="button" data-play>Jugar</button>
      </section>

      <section class="screen is-hidden" data-screen="select" aria-labelledby="select-title">
        <p class="eyebrow">elige nivel</p>
        <h2 id="select-title">Niveles</h2>
        <p class="screen-copy">Los niveles se desbloquean al superar el anterior.</p>
        <div class="level-select" data-level-select></div>
      </section>

      <section class="arena is-hidden" data-screen="game" aria-label="Zona de juego">
        <div class="action-ring" data-action-ring style="--progress: 1">
          <button class="pressure-button" type="button" data-pressure-button>
            <span data-button-label>pulsa</span>
          </button>
        </div>

        <p class="challenge-status" data-status>Respira mientras puedas.</p>

        <div class="controls">
          <button class="secondary-button" type="button" data-restart>Reiniciar</button>
          <button class="secondary-button" type="button" data-back-levels>Inicio</button>
        </div>
      </section>
    </main>

    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
