<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Presión es un juego web de reflejos, nervios y lógica tramposa con niveles configurables en JSON. Pulsa, espera, memoriza y no caigas."
    />
    <meta
      property="og:title"
      content="Presión · juego de reflejos y decisiones absurdas"
    />
    <meta
      property="og:description"
      content="Un botón enorme, instrucciones sospechosas y niveles cada vez más tensos."
    />
    <meta property="og:type" content="website" />
    <meta name="theme-color" content="#120017" />

    <title>Presión · juego de reflejos</title>

    <link rel="icon" href="./public/favicon.svg" type="image/svg+xml" />
  </head>

  <body
    class="min-h-screen bg-[var(--color-bg)] text-[var(--color-text)] antialiased"
  >
    <a class="skip-link" href="#game">Saltar al juego</a>

    <main id="game" class="game-shell" aria-live="polite">
      <section class="hero-panel" aria-labelledby="game-title">
        <p class="eyebrow">modo presión activado</p>
        <h1 id="game-title">Presión</h1>
        <p class="hero-copy">
          Un botón gigante. Reglas que cambian. Cero piedad. Los niveles viven
          en JSON para que puedas ampliar el caos cuando quieras.
        </p>
      </section>

      <section class="arena" aria-label="Zona de juego">
        <div class="hud" aria-label="Estado de partida">
          <p>
            <span>Nivel</span><strong data-level-current>1</strong>/<strong
              data-level-total
              >0</strong
            >
          </p>
          <p><span>Vidas</span><strong data-lives>3</strong></p>
          <p><span>Tiempo</span><strong data-time>--</strong></p>
        </div>

        <article class="challenge-card" data-card>
          <p class="challenge-kicker" data-level-type>calentamiento</p>
          <h2 data-level-title>Preparando presión...</h2>
          <p class="challenge-copy" data-level-instruction>Cargando niveles.</p>
          <p class="challenge-status" data-status>Respira mientras puedas.</p>

          <div
            class="memory-strip"
            data-memory-strip
            aria-label="Secuencia a memorizar"
          ></div>

          <button class="pressure-button" type="button" data-pressure-button>
            <span data-button-label>pulsa</span>
          </button>

          <div
            class="choice-grid"
            data-choice-grid
            aria-label="Opciones del nivel"
          ></div>
        </article>

        <div class="controls">
          <button class="secondary-button" type="button" data-restart>
            Reiniciar
          </button>
          <button class="secondary-button" type="button" data-next>
            Nivel siguiente
          </button>
        </div>
      </section>
    </main>

    <script type="module" src="./src/js/app.js"></script>
  </body>
</html>
